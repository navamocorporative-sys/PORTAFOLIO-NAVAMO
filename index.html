<!DOCTYPE html>
<html lang="es" data-theme="light" style="color-scheme: light;"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAVAMO · Portafolio de trabajo</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Figtree:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
:root{--ink:#0d0f12;--mist:#f2f6f7;--teal:#0b8794;--cyan:#00d8cf;--org:#ff4a05;--mut:#555d66;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:#fff;color:var(--ink);font:400 17px/1.5 Figtree,system-ui,sans-serif}
h1,h2{font-family:Anton,Impact,sans-serif;font-weight:400;line-height:1;margin:0;letter-spacing:.01em}
a{color:inherit}.w{max-width:1280px;margin:0 auto;padding:0 22px}
nav{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(8px)}
nav .w{display:flex;align-items:center;justify-content:space-between;height:76px}nav img{height:54px;display:block}
nav ul{display:flex;gap:28px;list-style:none;margin:0;padding:0;font-weight:500}nav ul a{text-decoration:none}nav ul a:hover{color:var(--teal)}
.bar{height:5px;background:linear-gradient(90deg,var(--teal),var(--cyan) 50%,var(--org))}
.btn{display:inline-block;background:var(--org);color:#fff;font-weight:700;text-decoration:none;padding:13px 24px;border-radius:6px;border:0;cursor:pointer;font:700 16px Figtree,sans-serif}
.btn:hover{background:#e04000}.btn.o{background:none;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}.btn.o:hover{background:var(--ink);color:#fff}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
main{padding:56px 0 80px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:30px}
h1{font-size:clamp(44px,7vw,84px)}
.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{font:500 15px Figtree,sans-serif;padding:9px 20px;border-radius:99px;border:1.5px solid #c5cfd4;background:#fff;cursor:pointer}
.tools button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.mas{display:flex;gap:14px;align-items:flex-start}.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.it{position:relative;border-radius:10px;overflow:hidden;background:#dfe7ea;cursor:pointer;border:0;padding:0;display:block;width:100%}
.it img,.it video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}.it:hover img,.it:hover video{transform:scale(1.04)}
.it .cap{position:absolute;inset:auto 0 0;padding:40px 14px 12px;color:#fff;font-weight:500;font-size:15px;text-align:left;background:linear-gradient(transparent,#000a)}
.it .pl{position:absolute;top:50%;left:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:#ff4a05e6;box-shadow:0 4px 18px #0006}
.it .pl::after{content:"";position:absolute;left:23px;top:17px;border-left:19px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent}
.it .du{position:absolute;top:10px;right:10px;background:#000b;color:#fff;border-radius:6px;padding:2px 8px;font-size:13px;font-weight:500}
.x{position:absolute;top:10px;left:10px;background:#000c;color:#fff;border:0;border-radius:6px;padding:5px 10px;cursor:pointer;z-index:2;font:500 13px Figtree}
.adm{background:var(--mist);border:2px dashed var(--teal);border-radius:12px;padding:22px;margin-bottom:30px}
.adm h2{font-size:26px;margin-bottom:6px}.adm p{margin:0 0 14px;color:var(--mut);font-size:15px}
.adm label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}.adm input[type=text]{width:100%;max-width:420px;padding:10px 12px;border:1.5px solid #bcc7cc;border-radius:6px;font:16px Figtree}
.adm .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.msg{font-weight:500}
.ct{background:var(--ink);color:#fff;padding:56px 0;position:relative}.ct::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--teal),var(--cyan) 50%,var(--org))}
.ct h2{font-size:clamp(32px,4vw,48px);margin-bottom:22px}.ct .row{display:flex;gap:14px;flex-wrap:wrap}.ct .btn.o{color:#fff;box-shadow:inset 0 0 0 2px #fff}.ct .btn.o:hover{background:#fff;color:var(--ink)}
footer{background:#07090b;color:#8d989f;padding:22px 0;font-size:14px}
#lb{position:fixed;inset:0;background:#000e;z-index:50;display:none;align-items:center;justify-content:center;padding:24px}#lb.on{display:flex}
#lb img,#lb video{max-width:100%;max-height:86vh;border-radius:6px}#lb button{position:absolute;top:16px;right:20px;background:#fff;border:0;border-radius:6px;padding:8px 16px;font:700 15px Figtree;cursor:pointer}
@media(max-width:700px){nav ul{display:none}main{padding:36px 0 56px}.mas,.col{gap:10px}.it .pl{transform:scale(.8)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>

","ig":""}}</script>
<script>
const S=JSON.parse(document.getElementById('state').textContent);let F='all',admin=false,A=null,ART=null,NC=0;
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mm=s=>Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');
function tile(i){const r=i.ar||1.5;
 return `<div style="position:relative">${admin?`<button class="x" type="button" data-d="${i.id}">Quitar</button>`:''}<button class="it" type="button" data-o="${i.id}" style="aspect-ratio:${r}" aria-label="Ver ${esc(i.n)}">${i.t=='v'?(i.p?`<img src="${i.p}" alt="">`:`<video src="${i.u}#t=0.5" preload="metadata" muted playsinline></video>`)+'<span class="pl"></span>'+(i.d?`<span class="du">${mm(i.d)}</span>`:''):`<img src="${i.u}" alt="${esc(i.n)}" loading="lazy">`}${i.n?`<span class="cap">${esc(i.n)}</span>`:''}</button></div>`}
function render(){
 const n=S.items.length,cols=innerWidth>1000?4:innerWidth>700?3:2;NC=cols;
 $('tools').innerHTML=n?[['all','Todo'],['v','Videos'],['i','Fotos']].map(([k,l])=>`<button type="button" data-f="${k}" aria-pressed="${F==k}">${l}</button>`).join(''):'';
 const H=Array(cols).fill(0),C=Array.from({length:cols},()=>[]);
 S.items.filter(i=>F=='all'||i.t==F).forEach(i=>{let k=H.indexOf(Math.min(...H));C[k].push(tile(i));H[k]+=1/(i.ar||1.5)+.02});
 $('grid').innerHTML=C.map(c=>`<div class="col">${c.join('')}</div>`).join('');
 const c=S.contact,w=(c.wa||'').replace(/\D/g,''),L=[];
 if(w)L.push(`<a class="btn" href="https://wa.me/52${w.slice(-10)}?text=${encodeURIComponent('Hola NAVAMO, vi su portafolio.')}">WhatsApp</a>`);
 if(c.email)L.push(`<a class="btn o" href="mailto:${esc(c.email)}">${esc(c.email)}</a>`);
 if(c.ig)L.push(`<a class="btn o" href="${esc(c.ig)}" target="_blank" rel="noopener">Instagram</a>`);
 $('cl').innerHTML=L.join('');$('contacto').hidden=$('nc').hidden=!L.length;
}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{const k=innerWidth>1000?4:innerWidth>700?3:2;if(k!=NC)render()},200)});
document.addEventListener('click',e=>{const t=e.target.closest('[data-f],[data-o],[data-d]');if(!t)return;
 if(t.dataset.f){F=t.dataset.f;render()}
 else if(t.dataset.o){const i=S.items.find(x=>x.id==t.dataset.o);$('lbc').innerHTML=i.t=='v'?`<video src="${i.u}" controls autoplay playsinline></video>`:`<img src="${i.u}" alt="${esc(i.n)}">`;$('lb').classList.add('on');$('lbx').focus()}
 else if(t.dataset.d&&confirm('¿Quitar este archivo del portafolio?')){const id=t.dataset.d;S.items=S.items.filter(x=>x.id!=id);A&&A.delete(id).catch(()=>{});save()}});
function closeLb(){$('lb').classList.remove('on');$('lbc').innerHTML=''}
$('lbx').onclick=closeLb;$('lb').onclick=e=>{if(e.target.id=='lb')closeLb()};document.addEventListener('keydown',e=>{if(e.key=='Escape')closeLb()});
async function save(){
 const d=document.documentElement.cloneNode(true);
 ['grid','tools','cl','lbc','pg'].forEach(i=>d.querySelector('#'+i).innerHTML='');['adm','contacto','nc'].forEach(i=>d.querySelector('#'+i).setAttribute('hidden',''));d.querySelector('#lb').className='';
 d.querySelectorAll('#adm input[type=text]').forEach(x=>x.removeAttribute('value'));
 d.querySelector('#state').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
 try{await ART.publish('<!DOCTYPE html>\n'+d.outerHTML)}catch(e){$('pg').textContent='No se pudo guardar ('+(e.code||'error')+'). Intenta de nuevo.'}}
function meta(f,t){return new Promise(res=>{const u=URL.createObjectURL(f);
 if(t=='i'){const im=new Image();im.onload=()=>{res({ar:im.naturalWidth/im.naturalHeight});URL.revokeObjectURL(u)};im.onerror=()=>res({ar:1.5});im.src=u}
 else{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='metadata';
  v.onloadedmetadata=()=>{v.currentTime=Math.min(1,v.duration/2)};
  v.onseeked=()=>{const m={ar:v.videoWidth/v.videoHeight,d:Math.round(v.duration)};try{const c=document.createElement('canvas');c.width=420;c.height=Math.round(420/m.ar);c.getContext('2d').drawImage(v,0,0,c.width,c.height);m.p=c.toDataURL('image/jpeg',.6)}catch(e){}URL.revokeObjectURL(u);res(m)};
  v.onerror=()=>res({ar:.5625});v.src=u}})}
async function init(){
 render();if(!window.claude)return;
 try{A=await claude.use('assets');ART=await claude.use('artifact')}catch(e){}
 if(!A||!ART)return;admin=true;$('adm').hidden=false;
 const c=S.contact;$('cw').value=c.wa;$('ce').value=c.email;$('ci').value=c.ig;render();
 $('up').onclick=()=>$('fi').click();
 $('sv').onclick=()=>{S.contact={wa:$('cw').value.trim(),email:$('ce').value.trim(),ig:$('ci').value.trim()};$('pg').textContent='Guardando…';save()};
 $('fi').onchange=async()=>{const fs=[...$('fi').files],ok=[];let bad=0;
  for(let k=0;k<fs.length;k++){const f=fs[k];$('pg').textContent=`Subiendo ${k+1} de ${fs.length}…`;
   const t=f.type.startsWith('video')?'v':f.type.startsWith('image')?'i':null;
   if(!t||f.size>20*1048576){bad++;continue}
   try{const m=await meta(f,t),r=await A.upload(f);ok.push(Object.assign({id:r.id,u:r.url,t,n:$('ti').value.trim()||f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ')},m))}catch(e){bad++}}
  if(bad)$('pg').textContent=`${bad} archivo(s) no se subieron (máximo 20 MB, solo fotos o videos).`;
  if(ok.length){S.items=ok.concat(S.items);$('pg').textContent='Publicando…';await save()}}
}
init();
</script>
